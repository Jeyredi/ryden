<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewards - Ryden</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="hero small">
    <h1>Rewards</h1>
    <p>Gana XP y sube de nivel</p>
</div>

<section class="rewards">

    <div class="reward-card">
        <h2>⭐ Nivel</h2>
        <p id="level">1</p>
    </div>

    <div class="reward-card">
        <h2>🔥 XP</h2>
        <p id="xp">0</p>
    </div>

    <div class="reward-card">
        <h2>💰 Coins</h2>
        <p id="coins">0</p>
    </div>

    <div class="missions">
        <h2>🎯 Misiones disponibles</h2>
        <div class="mission-item">
            <span>🎁 Misión de bienvenida — Por registrarte en Ryden</span>
            <button id="btn-welcome" onclick="claimMission('welcome', 50, 10)">Reclamar (+50 XP +10 coins)</button>
        </div>
    </div>

</section>

<script type="module" src="../js/firebase-auth-guard.js"></script>
<script src="../js/components.js"></script>
<script>
function xpForLevel(level) { return level * 100; }

function renderRewards() {
    const u = window.rydenUser;
    if (!u) return;

    document.getElementById("level").innerText = u.level;
    document.getElementById("xp").innerText    = u.xp + " / " + xpForLevel(u.level) + " XP";
    document.getElementById("coins").innerText = u.coins;

    const btn = document.getElementById("btn-welcome");
    if (u.missions["welcome"]) {
        btn.innerText     = "✅ Reclamada";
        btn.disabled      = true;
        btn.style.opacity = "0.5";
        btn.style.cursor  = "default";
    }
}

document.addEventListener("rydenUserReady", renderRewards);
</script>

</body>
</html>

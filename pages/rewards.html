<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewards - Ryden</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="hero small">
    <h1>Rewards</h1>
    <p>Gana puntos y sube de nivel</p>
</div>

<section class="rewards">

    <div class="reward-card">
        <h2>💰 Tus puntos</h2>
        <p id="points">0 RP</p>
    </div>

    <div class="reward-card">
        <h2>⭐ Nivel</h2>
        <p id="level">1</p>
    </div>

    <div class="missions">

        <h2>🎯 Misiones</h2>

        <button onclick="completeMission('login')">Iniciar sesión (+10 RP)</button>

        <button onclick="completeMission('play1')">Entrar a torneos (+20 RP)</button>

    </div>

</section>


<script type="module" src="../js/firebase-auth-guard.js"></script>
<script src="../js/components.js"></script>

</body>
</html>

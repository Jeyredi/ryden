<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Ryden</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>RYDEN</h1>
        <p>Crea tu cuenta para empezar a competir</p>

        <input id="username" type="text" placeholder="Usuario">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Contraseña">
        <input id="confirmPassword" type="password" placeholder="Confirmar contraseña">

        <button class="auth-btn" onclick="registerUser()">Crear cuenta</button>

        <p class="switch">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>

    </div>

</div>

<script type="module" src="../js/auth.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Ryden</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="hero small">
    <h1>Perfil</h1>
    <p>Tu identidad en Ryden</p>
</div>

<section class="profile">
    <div class="profile-card">
        <div class="avatar"></div>
        <h2 id="username">---</h2>
        <p class="tag" id="userTag">#RYD-000</p>

        <div class="stats">
            <div>
                <h3 id="coins">0</h3>
                <p>Coins</p>
            </div>
            <div>
                <h3 id="level">1</h3>
                <p>Nivel</p>
            </div>
            <div>
                <h3 id="xp">0</h3>
                <p>XP</p>
            </div>
        </div>

        <button class="logout-btn" onclick="logoutUser()">Cerrar sesión</button>
    </div>
</section>

<script type="module" src="../js/firebase-auth-guard.js"></script>
<script src="../js/components.js"></script>
<script>
document.addEventListener("rydenUserReady", () => {
    const u = window.rydenUser;
    document.getElementById("username").innerText = u.username;
    document.getElementById("userTag").innerText  = "#RYD-" + u.username.slice(0,3).toUpperCase();
    document.getElementById("coins").innerText    = u.coins;
    document.getElementById("level").innerText    = u.level;
    document.getElementById("xp").innerText       = u.xp;
});
</script>

</body>
</html>

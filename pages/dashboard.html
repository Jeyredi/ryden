<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ryden</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="hero small">
    <h1>Dashboard</h1>
    <p>Resumen de tu actividad en Ryden</p>
</div>

<section class="dashboard">

    <!-- USUARIO -->
    <div class="dash-card user-card">
        <h2>👤 <span id="d-user">---</span></h2>
        <p id="d-pass" class="pass-badge">Free</p>
    </div>

    <!-- XP Y NIVEL -->
    <div class="dash-card xp-card">
        <h2>⭐ Nivel <span id="d-level">1</span></h2>
        <div class="xp-bar-wrap">
            <div class="xp-bar" id="d-xp-bar" style="width:0%"></div>
        </div>
        <p class="xp-label">XP: <span id="d-xp">0</span> / <span id="d-xp-max">100</span></p>
    </div>

    <!-- COINS -->
    <div class="dash-card">
        <h2>💰 Monedas</h2>
        <p id="d-coins">0</p>
    </div>

    <!-- MISIONES -->
    <div class="dash-card big">
        <h2>🎯 Misiones</h2>
        <div class="mission-item">
            <span>🎁 Bienvenida — Por registrarte en Ryden</span>
            <button id="btn-welcome" onclick="claimMission('welcome', 50, 10)">Reclamar (+50 XP +10 coins)</button>
        </div>
    </div>

    <!-- ACCIONES -->
    <div class="dash-card big">
        <h2>⚡ Acciones rápidas</h2>
        <button onclick="location.href='torneos.html'">Ver Torneos</button>
        <button onclick="location.href='rewards.html'">Ir a Rewards</button>
        <button onclick="location.href='perfil.html'">Ver Perfil</button>
    </div>

</section>

<script type="module" src="../js/firebase-auth-guard.js"></script>
<script src="../js/components.js"></script>
<script>
function xpForLevel(level) { return level * 100; }

function renderDashboard() {
    const u = window.rydenUser;
    if (!u) return;

    document.getElementById("d-user").innerText   = u.username;
    document.getElementById("d-pass").innerText   = u.pass.charAt(0).toUpperCase() + u.pass.slice(1);
    document.getElementById("d-level").innerText  = u.level;
    document.getElementById("d-coins").innerText  = u.coins;

    const max = xpForLevel(u.level);
    const pct = Math.min((u.xp / max) * 100, 100);
    document.getElementById("d-xp").innerText     = u.xp;
    document.getElementById("d-xp-max").innerText = max;
    document.getElementById("d-xp-bar").style.width = pct + "%";

    // Botón misión: deshabilitar si ya reclamada
    const btn = document.getElementById("btn-welcome");
    if (u.missions["welcome"]) {
        btn.innerText  = "✅ Reclamada";
        btn.disabled   = true;
        btn.style.opacity = "0.5";
        btn.style.cursor  = "default";
    }
}

document.addEventListener("rydenUserReady", renderDashboard);
</script>

</body>
</html>

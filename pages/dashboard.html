<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ryden</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="hero small">
    <h1>Dashboard</h1>
    <p>Resumen de tu actividad en Ryden</p>
</div>

<section class="dashboard">

    <div class="dash-card user-card">
        <h2>👤 Usuario</h2>
        <p id="d-user">---</p>
        <p id="d-tag" style="opacity:0.5;font-size:13px;">---</p>
    </div>

    <div class="dash-card">
        <h2>💰 Coins</h2>
        <p id="d-coins">0</p>
    </div>

    <div class="dash-card">
        <h2>⭐ Nivel</h2>
        <p id="d-level">1</p>
    </div>

    <div class="dash-card">
        <h2>🔥 XP</h2>
        <p id="d-xp">0</p>
    </div>

    <div class="dash-card big">
        <h2>⚡ Acciones rápidas</h2>
        <button onclick="location.href='torneos.html'">Ver Torneos</button>
        <button onclick="location.href='rewards.html'">Ir a Rewards</button>
        <button onclick="location.href='perfil.html'">Ver Perfil</button>
    </div>

</section>

<script type="module" src="../js/firebase-auth-guard.js"></script>
<script src="../js/components.js"></script>
<script>
document.addEventListener("rydenUserReady", () => {
    const u = window.rydenUser;
    document.getElementById("d-user").innerText  = u.username;
    document.getElementById("d-tag").innerText   = "#RYD-" + u.username.slice(0,3).toUpperCase();
    document.getElementById("d-coins").innerText = u.coins;
    document.getElementById("d-level").innerText = u.level;
    document.getElementById("d-xp").innerText    = u.xp;
});
</script>

</body>
</html>

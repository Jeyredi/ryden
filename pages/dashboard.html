<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ryden</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="hero small">
    <h1>Dashboard</h1>
    <p>Resumen de tu actividad en Ryden</p>
</div>

<section class="dashboard">

    <div class="dash-card user-card">
        <h2>👤 Usuario</h2>
        <p id="d-user">---</p>
        <p id="d-tag">---</p>
    </div>

    <div class="dash-card">
        <h2>💰 RP</h2>
        <p id="d-points">0</p>
    </div>

    <div class="dash-card">
        <h2>⭐ Nivel</h2>
        <p id="d-level">1</p>
    </div>

    <div class="dash-card">
        <h2>🏆 Torneos</h2>
        <p id="d-matches">0</p>
    </div>

    <div class="dash-card big">
        <h2>⚡ Acciones rápidas</h2>
        <button onclick="location.href='torneos.html'">Ver Torneos</button>
        <button onclick="location.href='rewards.html'">Ir a Rewards</button>
        <button onclick="location.href='perfil.html'">Ver Perfil</button>
    </div>

</section>

<script src="../js/script.js"></script>
<script src="../js/components.js"></script>

</body>
</html>
